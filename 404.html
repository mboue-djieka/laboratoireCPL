<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page introuvable | Le Clair de la Plume</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #1A3A5C; --primary-light: #2A5080; --secondary: #2EAA76;
      --white: #FFFFFF; --light: #F8FAFC; --gray: #64748B; --dark: #1E293B;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; color: var(--dark); background: var(--light);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 40px 20px;
    }
    .code { font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin: 16px 0 10px; }
    p { color: var(--gray); max-width: 440px; margin-bottom: 28px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px;
      border-radius: 50px; font-weight: 600; font-size: .92rem; text-decoration: none;
      transition: transform .15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--secondary); color: var(--white); }
    .btn-outline { background: var(--white); color: var(--primary); border: 2px solid #CBD5E1; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Cette page n'existe pas ou plus</h1>
  <p>Le lien que vous avez suivi est peut-être ancien ou mal orthographié. Retrouvez nos analyses, nos offres ou contactez-nous directement sur WhatsApp.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Retour à l'accueil</a>
    <a href="/tarifs.html" class="btn btn-outline"><i class="fas fa-tags"></i> Voir les tarifs</a>
    <a href="/blog.html" class="btn btn-outline"><i class="fas fa-book-open"></i> Lire le blog</a>
    <a href="https://wa.me/237683258315?text=Bonjour%2C%20je%20cherchais%20une%20page%20sur%20votre%20site%20qui%20n%27existe%20plus." class="btn btn-outline" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
  </div>
</body>
</html>
